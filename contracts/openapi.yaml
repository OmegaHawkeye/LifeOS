openapi: 3.1.0
info:
  title: LifeOS API
  version: 1.0.0
  description: The client-neutral contract for the LifeOS modular monolith.
servers:
  - url: /api/v1
paths:
  /readiness:
    get:
      operationId: getReadiness
      summary: Report whether the API process is ready
      tags: [Foundation]
      responses:
        "200":
          description: The API process is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /me:
    get:
      operationId: getOwnerProfile
      summary: Return the authenticated owner profile
      tags: [Foundation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The current owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: loginOwner
      summary: Start an owner session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: A second factor is required before an owner session is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorLoginResponse"
        "422":
          description: The credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many sign-in attempts.
  /auth/two-factor/confirm:
    post:
      operationId: confirmOwnerTwoFactorSetup
      summary: Confirm first-time authenticator setup and start an owner session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: The authenticator is confirmed and the owner is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          description: A password sign-in is required first.
        "409":
          description: Two-factor setup is not pending.
        "422":
          description: The authenticator code is invalid or expired.
        "429":
          description: Too many verification attempts.
  /auth/two-factor/challenge:
    post:
      operationId: completeOwnerTwoFactorChallenge
      summary: Complete the authenticator challenge and start an owner session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: The owner is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          description: A password sign-in is required first.
        "409":
          description: Two-factor setup must be completed first.
        "422":
          description: The authenticator code is invalid or expired.
        "429":
          description: Too many verification attempts.
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: Revoke the current owner session
      tags: [Foundation]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The current session has been revoked.
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings:
    get:
      operationId: getOwnerSettings
      summary: Return the current owner's settings
      tags: [Foundation]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current owner settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettingsResponse"
        "401":
          description: The request is not authenticated.
    patch:
      operationId: updateOwnerSettings
      summary: Update the current owner's settings
      tags: [Foundation]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerSettingsRequest"
      responses:
        "200":
          description: The saved owner settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettingsResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: A setting is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/accounts:
    get:
      operationId: listFinanceAccounts
      summary: List the authenticated owner's active finance accounts and balances
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active accounts ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccountListResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createFinanceAccount
      summary: Create a finance account
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceAccountRequest"
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccountResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: An account field is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/categories:
    get:
      operationId: listFinanceCategories
      summary: List the authenticated owner's active transaction categories
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active categories ordered by type and name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategoryListResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createFinanceCategory
      summary: Create a finance transaction category
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceCategoryRequest"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategoryResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: A category field is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/categories/{category}:
    patch:
      operationId: updateFinanceCategory
      summary: Rename or recolor a category without changing its transaction references
      tags: [Finance]
      security:
        - cookieAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceCategoryRequest"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategoryResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: The category does not exist for this owner.
        "422":
          description: A category field is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/transactions:
    get:
      operationId: listFinanceTransactions
      summary: List the authenticated owner's income and expense transactions
      tags: [Finance]
      parameters:
        - name: account_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: category_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 50
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Transactions ordered by occurrence time, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionListResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createFinanceTransaction
      summary: Record an income or expense transaction
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceTransactionRequest"
      responses:
        "201":
          description: The created transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: The account or category does not exist for this owner.
        "422":
          description: The transaction fields are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/transactions/{transaction}:
    parameters:
      - name: transaction
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateFinanceTransaction
      summary: Update an income or expense transaction
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceTransactionRequest"
      responses:
        "200":
          description: The updated transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: The transaction, account, or category does not exist for this owner.
        "422":
          description: The transaction fields are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFinanceTransaction
      summary: Delete an income or expense transaction
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The transaction was deleted.
        "401":
          description: The request is not authenticated.
        "404":
          description: The transaction does not exist for this owner.
  /finance/budgets:
    get:
      operationId: listFinanceBudgets
      summary: List monthly category budgets with currency-matched spending
      tags: [Finance]
      security:
        - cookieAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
      responses:
        "200":
          description: Monthly budget targets with spent and remaining amounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBudgetListResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createFinanceBudget
      summary: Create a category budget for one month
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceBudgetRequest"
      responses:
        "201":
          description: The created budget including current spending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBudgetResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: The budget fields are invalid or duplicate.
  /finance/budgets/{budget}:
    parameters:
      - name: budget
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateFinanceBudget
      summary: Update a monthly category budget
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceBudgetRequest"
      responses:
        "200":
          description: The updated budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBudgetResponse"
        "404":
          description: The budget does not exist for this owner.
        "422":
          description: The budget fields are invalid.
    delete:
      operationId: deleteFinanceBudget
      summary: Delete a monthly category budget
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The budget was deleted.
        "404":
          description: The budget does not exist for this owner.
  /finance/subscriptions:
    get:
      operationId: listFinanceSubscriptions
      summary: List recurring expense subscriptions and renewals
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Owner subscriptions ordered by next renewal date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscriptionListResponse"
    post:
      operationId: createFinanceSubscription
      summary: Add a recurring expense subscription
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceSubscriptionRequest"
      responses:
        "201":
          description: The created subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscriptionResponse"
        "404":
          description: The account or category does not exist for this owner.
        "422":
          description: The subscription fields are invalid.
  /finance/subscriptions/{subscription}:
    parameters:
      - name: subscription
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateFinanceSubscription
      summary: Update subscription details or status
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceSubscriptionRequest"
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscriptionResponse"
        "404":
          description: The subscription does not exist for this owner.
        "422":
          description: The subscription fields are invalid.
  /finance/savings-goals:
    get:
      operationId: listFinanceSavingsGoals
      summary: List savings goals with progress and monthly pace
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Owner savings goals ordered by deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSavingsGoalListResponse"
    post:
      operationId: createFinanceSavingsGoal
      summary: Create a savings goal
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceSavingsGoalRequest"
      responses:
        "201":
          description: The created savings goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSavingsGoalResponse"
        "422":
          description: The savings goal fields are invalid.
  /finance/savings-goals/{goal}:
    parameters:
      - name: goal
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateFinanceSavingsGoal
      summary: Update a savings goal
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceSavingsGoalRequest"
      responses:
        "200":
          description: The updated savings goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSavingsGoalResponse"
        "404":
          description: The goal does not exist for this owner.
        "422":
          description: The savings goal fields are invalid.
    delete:
      operationId: deleteFinanceSavingsGoal
      summary: Delete a savings goal
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The goal was deleted.
        "404":
          description: The goal does not exist for this owner.
  /finance/overview:
    get:
      operationId: getFinanceOverview
      summary: Summarize one month's income, spending, and category totals
      tags: [Finance]
      security:
        - cookieAuth: []
      parameters:
        - name: month
          in: query
          description: Month in YYYY-MM format; defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: account_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Monthly totals grouped by currency and category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceOverviewResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: The month or account filter is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health/sources:
    get:
      operationId: listHealthSources
      summary: List the authenticated owner's health data sources
      tags: [Health]
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Health sources., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSourceListResponse" } } } }
        "401": { description: The request is not authenticated. }
    post:
      operationId: createHealthSource
      summary: Register a health data source
      tags: [Health]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateHealthSourceRequest" } } } }
      responses:
        "201": { description: The health source., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSourceResponse" } } } }
        "422": { description: Invalid source fields. }
  /health/sync-runs:
    post:
      operationId: startHealthSyncRun
      summary: Start a health import or sync run
      tags: [Health]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source_id], properties: { source_id: { type: integer, format: int64 } } } } } }
      responses:
        "201": { description: Running sync run., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSyncRunResponse" } } } }
  /health/sync-runs/{run}:
    patch:
      operationId: finishHealthSyncRun
      summary: Finish a health sync run
      tags: [Health]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: run, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [success, partial_success, failure] }, imported_count: { type: integer }, skipped_count: { type: integer }, failed_count: { type: integer } } } } } }
      responses:
        "200": { description: Finished sync run., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSyncRunResponse" } } } }
  /health/samples:
    get:
      operationId: listHealthSamples
      summary: List normalized health samples
      tags: [Health]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: sample_type, in: query, schema: { type: string, enum: [steps, sleep, heart_rate, workouts, calories, weight] } }]
      responses:
        "200": { description: Health samples., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSampleListResponse" } } } }
    post:
      operationId: ingestHealthSample
      summary: Ingest one normalized health sample idempotently
      tags: [Health]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateHealthSampleRequest" } } } }
      responses:
        "200": { description: Existing sample returned for an idempotent retry., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSampleResponse" } } } }
        "201": { description: Created sample., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSampleResponse" } } } }
  /health/imports:
    post:
      operationId: importAppleHealthXml
      summary: Import an Apple Health XML export
      tags: [Health]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Import summary., content: { application/json: { schema: { $ref: "#/components/schemas/HealthSyncRunResponse" } } } }
        "401": { description: The request is not authenticated. }
        "422": { description: Invalid or malformed XML input. }
  /finance/transfers:
    get:
      operationId: listFinanceTransfers
      summary: List the authenticated owner's paired account transfers
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Transfers ordered by occurrence time, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransferListResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createFinanceTransfer
      summary: Transfer value between two owned accounts
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceTransferRequest"
      responses:
        "201":
          description: The transfer pair. Transfers are stored separately from cash-flow transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransferResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: An account does not exist for this owner.
        "422":
          description: The transfer fields are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lifeos_session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          const: lifeos-api
        status:
          type: string
          const: ok
    OwnerProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OwnerProfile"
    OwnerProfile:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TwoFactorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
    TwoFactorLoginResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, secret]
              properties:
                status:
                  type: string
                  const: setup_required
                secret:
                  type: string
                  description: Base32 authenticator secret, returned only during authenticated first-time setup.
            - type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  const: challenge_required
    OwnerSettingsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OwnerSettings"
    OwnerSettings:
      type: object
      additionalProperties: false
      required:
        [
          timezone,
          currency,
          measurement_system,
          theme,
          mask_sensitive_data_by_default,
        ]
      properties:
        timezone:
          type: string
          example: Europe/Vienna
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        measurement_system:
          type: string
          enum: [metric, imperial]
        theme:
          type: string
          enum: [system, light, dark]
        mask_sensitive_data_by_default:
          type: boolean
    UpdateOwnerSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        timezone:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        measurement_system:
          type: string
          enum: [metric, imperial]
        theme:
          type: string
          enum: [system, light, dark]
        mask_sensitive_data_by_default:
          type: boolean
    FinanceAccount:
