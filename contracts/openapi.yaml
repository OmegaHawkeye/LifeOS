openapi: 3.1.0
info:
  title: LifeOS API
  version: 1.0.0
  description: The client-neutral contract for the LifeOS modular monolith.
servers:
  - url: /api/v1
paths:
  /readiness:
    get:
      operationId: getReadiness
      summary: Report whether the API process is ready
      tags: [Foundation]
      responses:
        "200":
          description: The API process is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /me:
    get:
      operationId: getOwnerProfile
      summary: Return the authenticated owner profile
      tags: [Foundation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The current owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: loginOwner
      summary: Start an owner session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: A second factor is required before an owner session is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorLoginResponse"
        "422":
          description: The credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many sign-in attempts.
  /mobile/auth/login:
    post:
      operationId: loginMobileOwner
      summary: Verify a mobile device's password before asking for an authenticator code
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginRequest"
      responses:
        "202":
          description: The password was verified and a short-lived authenticator challenge was created; unconfigured accounts receive enrollment material instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileLoginChallengeResponse"
        "422":
          description: The email or password are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many sign-in attempts.
  /mobile/auth/two-factor/challenge:
    post:
      operationId: completeMobileTwoFactorChallenge
      summary: Complete a mobile sign-in with its authenticator code
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTwoFactorChallengeRequest"
      responses:
        "201":
          description: The device's access and refresh credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileCredentialsResponse"
        "422":
          description: The challenge is invalid or expired, or the authenticator code is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many verification attempts.
  /mobile/auth/two-factor/cancel:
    post:
      operationId: cancelMobileTwoFactorChallenge
      summary: Cancel a pending mobile authenticator challenge
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTwoFactorCancelRequest"
      responses:
        "204":
          description: The pending challenge was canceled.
        "422":
          description: The challenge token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mobile/auth/refresh:
    post:
      operationId: refreshMobileCredentials
      summary: Rotate a one-time mobile refresh token
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshRequest"
      responses:
        "200":
          description: The previous refresh token is consumed and replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileCredentialsResponse"
        "422":
          description: The refresh token is invalid, expired, or has already been used.
        "429":
          description: Too many refresh attempts.
  /mobile/auth/revoke:
    post:
      operationId: revokeMobileDevice
      summary: Revoke a mobile device and its refresh-token family
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshRequest"
      responses:
        "204":
          description: The device credentials have been revoked.
        "422":
          description: The refresh token request is invalid.
        "429":
          description: Too many revocation attempts.
  /mobile/passkeys:
    post:
      operationId: beginMobilePasskeySignIn
      summary: Start a short-lived browser passkey sign-in for a native app
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobilePasskeyStartRequest" }
      responses:
        "201":
          description: The self-hosted LifeOS web origin to open for WebAuthn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobilePasskeyLoginUrlResponse" }
        "422": { description: State or PKCE challenge is invalid. }
        "429": { description: Too many passkey attempts. }
  /mobile/passkeys/prepare:
    post:
      operationId: prepareMobilePasskeySignIn
      summary: Bind a one-time mobile passkey request to the browser session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyStateRequest" }
      responses:
        "200": { description: The browser session is ready for the passkey ceremony. }
        "422": { description: The state is unknown or expired. }
  /mobile/passkeys/complete:
    post:
      operationId: completeMobilePasskeySignIn
      summary: Create a one-time native callback code after Fortify verifies a passkey
      tags: [Foundation]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyStateRequest" }
      responses:
        "200":
          description: The app callback URL containing a one-time code and matching state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobilePasskeyCallbackResponse" }
        "401": { description: The browser session is not authenticated. }
        "422": { description: A verified passkey session is required, or the state is expired. }
  /mobile/passkeys/exchange:
    post:
      operationId: exchangeMobilePasskeyCode
      summary: Exchange a one-time PKCE-bound passkey code for Sanctum mobile credentials
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobilePasskeyExchangeRequest" }
      responses:
        "200":
          description: The native app's short-lived access token and rotating refresh token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileCredentialsResponse" }
        "422": { description: The code is invalid, expired, replayed, or has the wrong PKCE verifier. }
        "429": { description: Too many passkey attempts. }
  /mobile/passkeys/management/redeem:
    post:
      operationId: redeemMobilePasskeyManagementSession
      summary: Redeem a short-lived one-time handoff to manage passkeys in the system browser
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyManagementRedeemRequest" }
      responses:
        "200": { description: The browser session is authenticated for passkey management. }
        "422": { description: The handoff is invalid, expired, or already used. }
  /auth/two-factor/confirm:
    post:
      operationId: confirmOwnerTwoFactorSetup
      summary: Confirm first-time authenticator setup and start an owner session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: The authenticator is confirmed and the owner is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          description: A password sign-in is required first.
        "409":
          description: Two-factor setup is not pending.
        "422":
          description: The authenticator code is invalid or expired.
        "429":
          description: Too many verification attempts.
  /auth/two-factor/challenge:
    post:
      operationId: completeOwnerTwoFactorChallenge
      summary: Complete the authenticator challenge and start an owner session
      tags: [Foundation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: The owner is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          description: A password sign-in is required first.
        "409":
          description: Two-factor setup must be completed first.
        "422":
          description: The authenticator code is invalid or expired.
        "429":
          description: Too many verification attempts.
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: Revoke the current owner session
      tags: [Foundation]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The current session has been revoked.
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/password:
    put:
      operationId: changeOwnerPassword
      summary: Change the authenticated owner's password
      tags: [Foundation]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed.
        "401":
          description: The request is not authenticated.
        "422":
          description: The current or new password is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings:
    get:
      operationId: getOwnerSettings
      summary: Return the current owner's settings
      tags: [Foundation]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current owner settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettingsResponse"
        "401":
          description: The request is not authenticated.
    patch:
      operationId: updateOwnerSettings
      summary: Update the current owner's settings
      tags: [Foundation]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerSettingsRequest"
      responses:
        "200":
          description: The saved owner settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettingsResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: A setting is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /security/two-factor:
    get:
      operationId: getTwoFactorStatus
      summary: Return the current owner's authenticator status
      tags: [Foundation]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Authenticator status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatusResponse" }
        "401": { description: The request is not authenticated. }
    delete:
      operationId: disableTwoFactor
      summary: Disable authenticator protection after password and code confirmation
      tags: [Foundation]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTwoFactorRequest" }
      responses:
        "204": { description: Authenticator disabled; mobile sessions revoked. }
        "401": { description: The request is not authenticated. }
        "422": { description: The password or authenticator code is invalid. }
  /security/passkeys:
    get:
      operationId: getOwnerPasskeys
      summary: List the current owner's passkeys without exposing credential material
      tags: [Foundation]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Safe metadata for the owner's passkeys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyListResponse" }
        "401": { description: The request is not authenticated. }
  /security/passkeys/management-sessions:
    post:
      operationId: beginMobilePasskeyManagement
      summary: Create a three-minute one-time browser handoff for native passkey management
      tags: [Foundation]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: A same-server browser URL with a fragment-only one-time token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyManagementUrlResponse" }
        "401": { description: The request is not authenticated. }
  /security/passkeys/{passkey}:
    delete:
      operationId: deleteOwnerPasskey
      summary: Remove one of the current owner's passkeys
      tags: [Foundation]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: passkey
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: The passkey was removed. }
        "401": { description: The request is not authenticated. }
        "404": { description: The passkey does not belong to this owner. }
  /security/two-factor/setup:
    post:
      operationId: beginTwoFactorSetup
      summary: Begin authenticator setup after password confirmation
      tags: [Foundation]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginTwoFactorSetupRequest" }
      responses:
        "200":
          description: Short-lived setup material; clients must only retain it in volatile memory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetupResponse" }
        "401": { description: The request is not authenticated. }
        "409": { description: Authenticator protection is already enabled. }
        "422": { description: The current password is invalid. }
  /security/two-factor/confirm:
    post:
      operationId: confirmTwoFactorSetup
      summary: Confirm authenticator setup with a current code
      tags: [Foundation]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCodeRequest" }
      responses:
        "200":
          description: Authenticator protection is enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatusResponse" }
        "401": { description: The request is not authenticated. }
        "422": { description: The authenticator code is invalid. }
  /backup/status:
    get:
      operationId: getBackupStatus
      summary: Return safe local backup status for the authenticated owner
      tags: [Foundation]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Backup status without local paths, credentials, or private data.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatusResponse"
        "401":
          description: The request is not authenticated.
  /account/export:
    get:
      operationId: downloadOwnerDataExport
      summary: Download the authenticated owner's portable LifeOS data archive
      tags: [Foundation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: A ZIP archive containing versioned structured data and private progress photos.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Prevents the export from being stored by shared or browser caches.
            Content-Disposition:
              schema:
                type: string
              description: Suggested filename for the downloaded archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account:
    delete:
      operationId: deleteOwnerAccount
      summary: Permanently delete the authenticated owner's account and data
      tags: [Foundation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOwnerAccountRequest"
      responses:
        "204":
          description: The account, associated data, sessions, tokens, and private files were deleted.
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The current password or exact email confirmation is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /routines:
    get:
      operationId: listRoutines
      summary: List today's active routines and recent completions
      tags: [Routines]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated owner's routines without historical backlog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutinesResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createRoutine
      summary: Create an owner routine
      tags: [Routines]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoutineRequest"
      responses:
        "201":
          description: The created routine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: The routine schedule is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /routines/{routine}:
    patch:
      operationId: updateRoutine
      summary: Update an owner routine
      tags: [Routines]
      security:
        - cookieAuth: []
      parameters:
        - name: routine
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoutineRequest"
      responses:
        "200":
          description: The updated routine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: The routine does not belong to this owner.
        "422":
          description: The routine schedule is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /routines/{routine}/snooze:
    post:
      operationId: snoozeRoutine
      summary: Snooze today's routine reminder
      tags: [Routines]
      security:
        - cookieAuth: []
      parameters:
        - name: routine
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes:
                  type: integer
                  enum: [15, 60, 180]
      responses:
        "200":
          description: The snoozed routine reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineActionResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: The routine does not belong to this owner.
        "422":
          description: The routine cannot be snoozed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /routines/{routine}/complete:
    post:
      operationId: completeRoutine
      summary: Complete today's scheduled routine
      tags: [Routines]
      security:
        - cookieAuth: []
      parameters:
        - name: routine
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The completed routine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineActionResponse"
        "401":
          description: The request is not authenticated.
        "404":
          description: The routine does not belong to this owner.
        "422":
          description: The routine is not scheduled today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dashboard/weekly-review:
    get:
      operationId: getWeeklyReview
      summary: Summarize the previous full week across life domains
      tags: [Dashboard]
      security:
        - cookieAuth: []
      parameters:
        - name: week_start
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The requested week's summary and saved review notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReviewSummaryResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: The selected week must start on a Monday.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveWeeklyReview
      summary: Save review notes and next week's focus
      tags: [Dashboard]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWeeklyReviewRequest"
      responses:
        "200":
          description: The saved review entry. Fetch the summary endpoint for refreshed domain signals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReviewEntryResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: The selected week must start on a Monday.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/accounts:
    get:
      operationId: listFinanceAccounts
      summary: List the authenticated owner's active finance accounts and balances
      tags: [Finance]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active accounts ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccountListResponse"
        "401":
          description: The request is not authenticated.
    post:
      operationId: createFinanceAccount
      summary: Create a finance account
      tags: [Finance]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceAccountRequest"
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAccountResponse"
        "401":
          description: The request is not authenticated.
        "422":
          description: An account field is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/accounts/{account}:
    patch:
      operationId: updateFinanceAccount
      summary: Change whether an account contributes to net worth
      tags: [Finance]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFinanceAccountRequest" }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAccountResponse" }
        "401": { description: The request is not authenticated. }
        "404": { description: Account not found for this owner. }
        "422": { description: Invalid account selection. }
  /finance/assets:
    get:
      operationId: listFinanceAssets
      summary: List active owner assets with current manual values
      tags: [Finance]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Active assets ordered by type and name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAssetListResponse" }
        "401": { description: The request is not authenticated. }
    post:
      operationId: createFinanceAsset
      summary: Create an asset and optionally record its first valuation
      tags: [Finance]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceAssetRequest" }
      responses:
        "201":
          description: Created asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAssetResponse" }
        "401": { description: The request is not authenticated. }
        "422": { description: Invalid asset or account ownership. }
  /finance/assets/{asset}:
    patch:
      operationId: updateFinanceAsset
      summary: Include or archive an asset
      tags: [Finance]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: asset
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFinanceAssetRequest" }
      responses:
        "200":
