components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lifeos_session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          const: lifeos-api
        status:
          type: string
          const: ok
    OwnerProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OwnerProfile"
    OwnerProfile:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    MobileLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          minLength: 1
          maxLength: 80
    MobileLoginChallengeResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, challenge_token, challenge_expires_at]
          properties:
            status:
              type: string
              enum: [challenge_required, setup_required]
            secret:
              type: string
              description: Present only for initial enrollment and never persist this value on the client.
            challenge_token:
              type: string
              minLength: 40
              maxLength: 128
            challenge_expires_at:
              type: string
              format: date-time
    TwoFactorStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
    BeginTwoFactorSetupRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
