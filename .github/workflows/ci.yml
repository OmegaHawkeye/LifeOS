name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lifeos
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@24

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: intl, pdo_pgsql, zip

      - name: Install PHP dependencies
        run: composer install --working-dir=backend --no-interaction --no-progress --prefer-dist

      - name: Install web dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Prepare Laravel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lifeos
          DB_USERNAME: lifeos
          DB_PASSWORD: lifeos-ci
        run: |
          cp backend/.env.example backend/.env
          php backend/artisan key:generate --no-interaction
          php backend/artisan migrate --no-interaction

      - name: Run repository checks
        run: pnpm check

  home-server-smoke:
    name: Clean install and Compose upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6

      - name: Check out base source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: smoke-base

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest released image for upgrade test
        id: release-image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/omegahawkeye/lifeos
        run: |
          release_tag="$(gh release list --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease == false) | .tagName][0] // ""')"

          if [[ -z "$release_tag" ]]; then
            echo "build_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest stable release has a non-SemVer tag: $release_tag" >&2
            exit 1
          fi

          release_version="${release_tag#v}"
          if pull_output="$(docker pull "$IMAGE:$release_version" 2>&1)"; then
            printf '%s\n' "$pull_output"
            docker tag "$IMAGE:$release_version" "$IMAGE:0.0.0-smoke-base"
            echo "build_base=false" >> "$GITHUB_OUTPUT"
          elif [[ "$pull_output" == *"manifest unknown"* || "$pull_output" == *"not found"* ]]; then
            printf 'No image exists yet for the latest release; building the base revision instead.\n'
            echo "build_base=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$pull_output" >&2
            echo "Could not pull latest released image $IMAGE:$release_version." >&2
            exit 1
          fi

      - name: Build base image before the first published container release
        if: steps.release-image.outputs.build_base == 'true'
        uses: docker/build-push-action@v6
        with:
          context: smoke-base
          file: ${{ github.workspace }}/Dockerfile
          load: true
          tags: ghcr.io/omegahawkeye/lifeos:0.0.0-smoke-base
          cache-from: type=gha,scope=lifeos-smoke-base
          cache-to: type=gha,scope=lifeos-smoke-base,mode=max

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/omegahawkeye/lifeos:0.0.0-smoke-candidate
          cache-from: type=gha,scope=lifeos-smoke-candidate
          cache-to: type=gha,scope=lifeos-smoke-candidate,mode=max

      - name: Test clean install and Compose upgrade
        run: bash scripts/home-server-smoke.sh 0.0.0-smoke-base 0.0.0-smoke-candidate
