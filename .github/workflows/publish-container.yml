name: Publish LifeOS container

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish versioned multi-architecture image
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable SemVer release tag such as v0.15.0." >&2
            exit 1
          fi
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          IMAGE: ghcr.io/omegahawkeye/lifeos
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Image version $VERSION already exists and will not be overwritten." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/omegahawkeye/lifeos:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/OmegaHawkeye/LifeOS
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=lifeos-release
          cache-to: type=gha,scope=lifeos-release,mode=max
