services:
  - type: web
    name: lifeos-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/readiness
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: lifeos-postgres
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database

  - type: worker
    name: lifeos-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: lifeos-postgres
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: QUEUE_CONNECTION
        value: database

  - type: cron
    name: lifeos-scheduler
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "* * * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: lifeos-postgres
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: lifeos-postgres
    databaseName: lifeos
    user: lifeos
    region: frankfurt
    plan: 0.1c-256mb
    ipAllowList: []
